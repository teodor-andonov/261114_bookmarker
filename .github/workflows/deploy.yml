name: Deploy Testlab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Transcribe prototype
        run: cd 261114_transcribe && npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser-only Replicad Studio
        working-directory: 261115_replicad-studio
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Assemble landing page and self-contained prototypes
        run: python3 .github/scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
