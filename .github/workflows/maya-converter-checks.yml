name: Maya Converter checks
on:
  pull_request:
    paths:
      - '261116_maya-to-3dm/**'
      - '.github/workflows/maya-converter-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build Maya converter
        working-directory: 261116_maya-to-3dm
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
