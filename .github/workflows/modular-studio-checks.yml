name: Verify Modular Studio

on:
  pull_request:
    paths:
      - '261116_modular-studio/**'
      - '.github/workflows/modular-studio-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test and compile
        working-directory: 261116_modular-studio
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
