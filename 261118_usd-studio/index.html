<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USD Studio · Testlab</title><link rel="stylesheet" href="./style.css"></head>
<body><header><strong>USD <span>STUDIO</span></strong><div id="name">untitled.js</div><button id="commands" title="Ctrl/⌘ + K">Commands <kbd>⌘ K</kbd></button></header>
<div id="status" role="status" aria-live="polite">Loading SMLib WASM…</div>
<main><section class="source"><div class="bar"><button id="jsTab" aria-pressed="true">JavaScript</button><button id="usdTab" aria-pressed="false">USDA</button><span class="grow"></span><button id="run">Run</button></div><div id="editor"></div><pre id="usda" hidden></pre><div class="foot">Trusted local JavaScript · defaultParams exposes controls</div></section>
<section class="right"><div class="bar"><span>VIEWPORT</span><span class="grow"></span><select id="mode" aria-label="Display mode"><option value="edges">Shaded + edges</option><option value="shaded">Shaded</option><option value="wire">Wireframe</option></select><button id="fit">Fit</button></div><div id="viewport"><canvas id="canvas"></canvas><span class="overlay">Z ↑ · Orbit / pan / zoom</span></div><div class="bar">PARAMETERS</div><div id="params" class="params"></div><div id="stats" class="foot">No model yet</div><div class="bar"><label><input type="checkbox" id="mesh"> Include preview mesh in USDA</label><span class="grow"></span><button id="export" disabled>Export USDA</button></div></section></main>
<dialog id="palette"><input id="search" placeholder="Search commands…" autocomplete="off"><div id="items"></div></dialog><input type="file" id="open" accept=".js,text/javascript" hidden><script type="module" src="./app.js"></script></body></html>
